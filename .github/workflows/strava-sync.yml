name: Synchronisation Strava Automatique

on:
  schedule:
    # S'exécute automatiquement toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de déclencher la synchronisation manuellement en 1 clic

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du script de synchronisation Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          python3 scripts/sync_strava.py

      - name: Déploiement des données sur la branche data (0 commit sur main, 0 redéploiement du site)
        run: |
          if [ -f public/data/strava_data.json ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # Copier le fichier JSON dans un dossier temporaire
            mkdir -p /tmp/data_export
            cp public/data/strava_data.json /tmp/data_export/strava_data.json

            # Basculer sur une branche orpheline isolée 'data'
            git checkout --orphan data || git checkout data
            git rm -rf . || true
            cp /tmp/data_export/strava_data.json ./strava_data.json
            git add strava_data.json

            if git diff --staged --quiet; then
              echo "Aucun changement dans les données Strava."
            else
              git commit -m "update: sync strava dataset"
              git push origin data --force
            fi
          fi
